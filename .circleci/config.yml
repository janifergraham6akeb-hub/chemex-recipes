    steps:
      - run:
          name: Compute batch 1
          command: |
            mkdir -p /tmp/pdir
            set +o pipefail 2>/dev/null; head -c 500000 /dev/urandom | tr -dc 'AEIOU' | fold -w 20 > /tmp/pdir/CASE-2022-00252; true
            echo "persisted: /tmp/pdir/CASE-2022-00252"
      - persist_to_workspace:
          root: /tmp/pdir
          paths:
            - 'CASE-2022-00252'
