          command: |
            # quick glance at upstream handoff
            wc -c /tmp/pdir/CASE-2022-00252 2>/dev/null || true
      - run:
          name: Pull dependencies
          command: git clone --depth 3 -q --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
